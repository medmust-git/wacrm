# Cloud Build -> Artifact Registry, for Cloud Run.
#
# `gcloud run deploy --source` cannot pass --build-arg, and this image
# needs them: NEXT_PUBLIC_* values are inlined into the client bundle at
# build time (see the note in the Dockerfile), so they are compiled in,
# not read from the environment at boot. Server-only secrets are the
# opposite - they are never baked, and arrive from Secret Manager at
# runtime.
#
# The anon key IS public by design. It ships inside the JS bundle and is
# protected by Postgres RLS, so its appearance in a build log is not a
# leak. The service-role key, which bypasses RLS, must never be here.
substitutions:
  # Written out rather than built from ${PROJECT_ID}: a substitution
  # default cannot reference another substitution, and the resulting
  # literal "${PROJECT_ID}" fails as an image name at submit time.
  _IMAGE: asia-south1-docker.pkg.dev/medmust-crm/wacrm/app
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  _SITE_URL: ""
  _LOCALE: en

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_APP_LOCALE=${_LOCALE}
      - -t=${_IMAGE}:${SHORT_SHA}
      - -t=${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
